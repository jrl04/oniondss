<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extension inbox · Onion DSS</title>
<style>
:root{--green:#376c42;--ink:#24342b;--muted:#738075;--line:#dce4d8;--paper:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px max(calc((100vw - 1180px)/2),24px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:1.2px;font-weight:800;color:var(--green)}h1{font-size:25px;margin:3px 0}.wrap{max-width:1180px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.head{padding:17px;border-bottom:1px solid var(--line);font-weight:800}.filters{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}.list{max-height:72vh;overflow:auto}.item{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:15px;cursor:pointer;color:inherit}.item.active,.item:hover{background:#eff4e9}.name{font-weight:800}.meta,.preview{font-size:12px;color:var(--muted);margin-top:4px}.badge{font-size:10px;text-transform:uppercase;color:var(--green);font-weight:800;float:right}.thread{min-height:70vh;display:flex;flex-direction:column}.messages{flex:1;padding:20px;overflow:auto;max-height:60vh}.bubble{padding:12px 14px;border-radius:14px;max-width:78%;margin:10px 0;background:#eff4e9}.bubble.out{margin-left:auto;background:#e8f0e4}.by{font-size:10px;color:var(--muted);margin-top:5px}.compose{border-top:1px solid var(--line);padding:15px;display:flex;gap:10px}textarea{flex:1;resize:vertical;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}button.send{background:var(--green);color:#fff;border:0;border-radius:10px;padding:0 20px;font-weight:800;cursor:pointer}.empty{padding:25px;color:var(--muted)}@media(max-width:760px){.wrap{grid-template-columns:1fr}.list{max-height:34vh}.thread{min-height:50vh}}
</style></head><body>{% csrf_token %}<header class="top"><div><div class="brand">MULTIPLIER ONION DSS</div><h1>Extension inbox</h1></div><a href="/admin/">Admin</a></header><main class="wrap"><section class="panel"><div class="head">Farmer conversations</div><div class="filters">Open requests first · refreshes every 30 seconds</div><div class="list" id="list"></div></section><section class="panel thread"><div class="head" id="threadTitle">Choose a conversation</div><div class="messages" id="messages"><div class="empty">Select a farmer message to review its history and reply.</div></div><form class="compose" id="replyForm"><textarea id="reply" placeholder="Write a reply to the farmer…" required></textarea><button class="send">Reply</button></form></section></main>
<script>
let selected=null, rows=[];const $=id=>document.getElementById(id);const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';
async function load(){try{const r=await fetch('/api/conversations/');if(!r.ok)return;const j=await r.json();rows=Array.isArray(j)?j:(j.results||[]);rows.sort((a,b)=>(a.status==='awaiting_officer'?-1:1)-(b.status==='awaiting_officer'?-1:1)||new Date(b.updated_at)-new Date(a.updated_at));$('list').innerHTML=rows.map(c=>`<button class="item ${selected===c.id?'active':''}" data-id="${c.id}"><span class="badge">${c.status.replace('_',' ')}</span><div class="name">${esc(c.farmer_name)} · ${esc(c.field_code||'General')}</div><div class="preview">${esc(c.messages.at(-1)?.body||c.subject)} · ${esc(c.channel.toUpperCase())}</div></button>`).join('')||'<div class="empty">No conversations yet.</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>open(Number(b.dataset.id)));if(selected)renderThread(rows.find(c=>c.id===selected));}catch(e){console.error(e)}}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function open(id){selected=id;renderThread(rows.find(c=>c.id===id));load()}
function renderThread(c){if(!c)return;$('threadTitle').textContent=`${c.farmer_name} · ${c.field_code||'General'} · ${c.channel.toUpperCase()}`;$('messages').innerHTML=c.messages.map(m=>`<div class="bubble ${m.direction==='outbound'?'out':''}">${esc(m.body)}${m.photo_url?`<div><a target="_blank" href="${esc(m.photo_url)}">View attached photo</a></div>`:''}<div class="by">${m.direction==='outbound'?'Officer':'Farmer'} · ${new Date(m.created_at).toLocaleString()} · ${esc(m.delivery_status)}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
$('replyForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const body=$('reply').value.trim();if(!body)return;const r=await fetch(`/api/conversations/${selected}/reply/`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({body})});if(r.ok){$('reply').value='';await load()}else alert('Reply failed. Please reload and try again.')};load();setInterval(load,30000);
</script></body></html>
